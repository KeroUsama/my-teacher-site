<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth With Kero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>موقعي التعليمي 👋</h1>
        <button class="reset-btn" onclick="resetProgress()">🔄 إعادة تعيين التقدم</button>

        <!-- شريط التقدم العام -->
        <div class="overall-progress">
            <div class="progress-info">
                <span>📊 تقدمك الكلي في المنهج</span>
                <span class="progress-text" id="overall-progress-text">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="overall-progress-fill"></div>
            </div>
        </div>

        <div id="lessons-container"></div>
    </div>

    <script src="lessons.js"></script>
    <script src="script.js"></script>
</body>
</html>
